{% extends "core/base.html" %}
{% load static %}

{% block content %}
<div class="d-flex justify-content-center">
    <div class="text-center" style="max-width: 360px; width: 100%;">
        {% comment %} <h1 class="text-primary">Login</h1> {% endcomment %}
        <br>
        <img src="{% static 'logo.png' %}" alt="Logo" class="img-fluid d-block mx-auto" width="300" height="300">
        <br>
        <form method="post">
            {% csrf_token %}
            <div class="input-group mb-3 border-primary border-1">
                <label for="username" class="input-group-text border-primary border-1" placeholder="Username">Username</label>
                <input type="text" class="form-control text-center border-primary border-1" id="username" name="username" placeholder="Username" required></input>
            </div>
            <div class="input-group mb-3 border-primary border-1">
                <label for="password" class="input-group-text border-primary border-1">Password</label>
                <input type="password" class="form-control text-center border-primary border-1" id="password" name="password" placeholder="Password" required></input>
            </div>
            <button type="submit" class="btn btn-outline-primary" style="width: 60%;">Login</button>
        </form>
    </div>
</div>
{% endblock %}
